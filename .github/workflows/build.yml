name: Build BeeWare Android APK

on:
  # Pulls trigger execution logic completely off automatic triggers
  workflow_dispatch: # Enables manual on-click triggers inside the GUI portal

jobs:
  android-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Base
      uses: actions/checkout@v4

    - name: Set up System Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' # Caches your pip dependencies (briefcase, etc.)

    - name: Set up Java JDK Engine
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # Optimization: Cache Android Gradle packages to save compilation time
    - name: Setup Gradle Cache
      uses: gradle/actions/setup-gradle@v4

    # Optimization: Cache the internal Android SDK tooling briefcase downloads
    - name: Cache Android SDK Tools
      uses: actions/cache@v4
      with:
        path: ~/.cache/briefcase
        key: ${{ runner.os }}-briefcase-sdk-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-briefcase-sdk-

    - name: Install System Packaging Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y git gridengine-client
        python -m pip install --upgrade pip
        pip install briefcase

    - name: Initialize Android Template Wrapper
      run: |
        briefcase create android --no-input

    - name: Compile and Package Artifacts
      run: |
        briefcase build android --no-input
        briefcase package android --no-sign --no-input

    - name: Preserve Compiled App Binaries
      uses: actions/upload-artifact@v4
      with:
        name: beeware-android-apk
        path: android/Gradle/*/*/*.apk
